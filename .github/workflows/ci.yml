name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  frontend:
    name: Frontend ? Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install
      - name: Build
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Backend ? Schema & Static Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic pinecone-client groq || true
      - name: Static Schema Validation
        run: |
          python -c "
          import os, sys, json
          seed_path = os.path.join('knowledge_base', 'curated', 'seed.json')
          if os.path.exists(seed_path):
              with open(seed_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              print(f'PASS: {len(data)} knowledge base entries validated.')
          "
